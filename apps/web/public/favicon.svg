<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="darkTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5e56"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Back wallet fold & Titanium frame -->
  <path d="M11 16 L29 8 C31 7.2 33 8.3 33 10.5 L33 34 C33 36 31 37.5 29 38 L11 32 C9.5 31.5 8.5 30 8.5 28 L8.5 19 C8.5 17.5 9.5 16.5 11 16 Z"
        fill="url(#titanium)" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- Gold Bank Card peeking out -->
  <path d="M11 18 L26 12 C27 11.6 28.2 12.2 28.6 13.2 L29.5 17 L12 25 Z"
        fill="url(#gold)"/>
  <!-- Card chip -->
  <rect x="17" y="15" width="4" height="3" rx="0.8" fill="#78350f" opacity="0.7"/>

  <!-- Front Wallet Pocket / Body in rich Emerald Teal -->
  <path d="M16 20 L37 14 C39.5 13.3 42 15 42 17.5 L42 39 C42 41.5 39.5 43.5 37 44 L16 38 C14 37.5 12.5 35.5 12.5 33.5 L12.5 24 C12.5 22 14 20.5 16 20 Z"
        fill="url(#teal)" stroke="#2dd4bf" stroke-width="1.2"/>

  <!-- Front flap & Gold button clasp -->
  <path d="M32 26 L43 23.5 C44.5 23.2 46 24.2 46 25.8 L46 31 C46 32.5 44.5 33.8 43 34.2 L32 32 Z"
        fill="url(#darkTeal)" stroke="#14b8a6" stroke-width="1"/>
  <circle cx="40" cy="28.5" r="3.8" fill="url(#gold)" stroke="#fef08a" stroke-width="0.8"/>
  <circle cx="40" cy="28.5" r="2" fill="none" stroke="#92400e" stroke-width="0.6"/>
</svg>