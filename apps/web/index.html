<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Finance Tracker · Track every rupee</title>
    <meta
      name="description"
      content="Record income and expenses, see daily, weekly, monthly and yearly reports, plan budgets and reach savings goals."
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/manifest.webmanifest?v=5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Signed out on "/": fetch the first hero photo now, not once the app's
      // JS has run. Keep in step with FIRST_HERO in landing-image.ts.
      (() => {
        try {
          if (location.pathname !== "/") return;
          if (JSON.parse(localStorage.getItem("ft-user") || "{}").state?.user)
            return;
          const l = document.createElement("link");
          l.rel = "preload";
          l.as = "image";
          l.fetchPriority = "high";
          l.imageSrcset =
            "/images/piggy-bank-640.webp 640w, /images/piggy-bank.webp 1200w";
          l.imageSizes = "(min-width: 1024px) 50vw, 100vw";
          document.head.appendChild(l);
        } catch {}
      })();
    </script>
    <script>
      // Apply the saved theme before first paint (no flash). Keep in step
      // with applyTheme in src/stores/theme-store.ts.
      (() => {
        try {
          const s =
            JSON.parse(localStorage.getItem("ft-theme") || "{}").state || {};
          const t = s.theme || "system";
          const mode =
            t !== "system"
              ? t
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? s.systemDark || "dark"
                : "light";
          const root = document.documentElement;
          if (mode !== "light") root.classList.add("dark");
          root.dataset.theme = mode;
          const vars = s.vars?.[mode];
          if (vars)
            for (const k in vars) root.style.setProperty(k, vars[k]);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
