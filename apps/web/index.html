<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Finance Tracker · Track every rupee</title>
    <meta
      name="description"
      content="Record income and expenses, see daily, weekly, monthly and yearly reports, plan budgets and reach savings goals."
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (no flash). Keep in step
      // with applyTheme in src/stores/theme-store.ts.
      (() => {
        try {
          const s =
            JSON.parse(localStorage.getItem("ft-theme") || "{}").state || {};
          const t = s.theme || "system";
          const mode =
            t !== "system"
              ? t
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? s.systemDark || "dark"
                : "light";
          const root = document.documentElement;
          if (mode !== "light") root.classList.add("dark");
          root.dataset.theme = mode;
          const vars = s.vars?.[mode];
          if (vars)
            for (const k in vars) root.style.setProperty(k, vars[k]);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
